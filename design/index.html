<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IQUM · Tasarım önizlemesi</title><style>:root{color-scheme:light dark;--background:light-dark(#faf9f6,#191a18);--foreground:light-dark(#292722,#eeeae1);--muted-foreground:light-dark(#777168,#b6b1a5);font:14px/1.5 'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;padding:28px 16px;background:var(--background);color:var(--foreground)}body>#iqum-preview{max-width:736px;margin:auto}.viz-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:18px}.form-label{display:grid;gap:5px;font-size:12px}.form-select{font:14px 'Segoe UI',sans-serif;background:var(--background);color:var(--foreground);border:1px solid #8e887b77;padding:9px 30px 9px 12px;border-radius:8px;min-height:40px}.text-small{font-size:12px}.text-muted{color:var(--muted-foreground)}.viz-dotted-background{background-image:radial-gradient(#8e887b44 .7px,transparent .7px);background-size:16px 16px}button{font:inherit}button:not(:disabled),select{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #a17e38;outline-offset:3px}[hidden]{display:none!important}
</style></head><body><div id="iqum-preview" lang="tr">
  <div class="viz-controls" aria-label="Tasarım inceleme kontrolleri">
    <label class="form-label">Ekran
      <select class="form-select" id="iq-screen">
        <option value="home">Ana sayfa</option><option value="levels">Leveller</option>
        <option value="sequence">Sıra Hafızası</option><option value="matching">Kart Eşleştirme</option>
        <option value="path">Hafıza Yolu</option><option value="duel">Düello lobisi</option>
        <option value="result">Sonuç</option><option value="account">Hesap ve ayarlar</option>
        <option value="brand">Logo ve kimlik</option>
      </select>
    </label>
    <label class="form-label">Durum<select class="form-select" id="iq-state"></select></label>
    <label class="form-label">Cihaz<select class="form-select" id="iq-platform"><option value="android">Android</option><option value="ios">iOS</option></select></label>
    <label class="form-label" id="iq-viewer-label" hidden>Oyuncu bakışı
      <select class="form-select" id="iq-viewer"><option value="0">Senin ekranın</option><option value="1">Deniz'in ekranı</option></select>
    </label>
  </div>
  <div class="iq-stage viz-dotted-background">
    <main class="iq-device" aria-label="IQUM mobil uygulama tasarımı">
      <div class="iq-status"><span>9:41</span><span class="iq-island" aria-hidden="true"></span><span>5G <span class="iq-battery" aria-hidden="true"></span></span></div>
      <div id="iq-app"></div><div class="iq-home-indicator" aria-hidden="true"></div>
    </main>
  </div>
  <p class="text-small text-muted" id="iq-preview-note" role="status" style="margin-top:12px">Tasarım önizlemesi · hesaplar ve rakipler örnektir.</p>
</div>
<style>
  #iqum-preview{--iq-ivory:#f5f8f5;--iq-paper:#ffffff;--iq-ink:#183831;--iq-muted:#6a7c73;--iq-walnut:#1c4b45;--iq-dark:#123e38;--iq-gold:#d69a47;--iq-gold-light:#f0dab1;--iq-green:#147d69;--iq-red:#ce6358;--iq-line:#dce5dc;--iq-flip:340ms;--iq-depth:5px;--iq-radius:8px}
  #iqum-preview .iq-stage{padding:28px 12px;display:grid;justify-items:center;align-items:start}
  #iqum-preview .iq-device{width:100%;max-width:390px;border:7px solid #30312c;border-radius:43px;background:var(--iq-ivory);color:var(--iq-ink);box-shadow:0 24px 52px #0002,0 2px 4px #0002;overflow:hidden;font:14px/1.45 'Segoe UI',sans-serif;isolation:isolate;position:relative;color-scheme:light}
  #iqum-preview .iq-device *{box-sizing:border-box}
  #iqum-preview .iq-status{height:45px;padding:12px 21px 0;display:flex;align-items:flex-start;justify-content:space-between;font-size:12px;font-weight:600;position:relative}
  #iqum-preview .iq-status>span:last-child{display:flex;gap:7px;align-items:center}
  #iqum-preview .iq-island{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:91px;height:24px;background:#123e38;border-radius:16px}
  #iqum-preview .iq-battery{display:inline-block;width:19px;height:9px;border:1px solid currentColor;border-radius:2px;position:relative}
  #iqum-preview .iq-battery:before{content:'';position:absolute;inset:1px;background:currentColor;border-radius:1px}
  #iqum-preview .iq-battery:after{content:'';position:absolute;width:2px;height:4px;right:-4px;top:1.5px;background:currentColor}
  #iqum-preview .iq-home-indicator{width:108px;height:4px;border-radius:3px;background:#183831;margin:8px auto}
  #iqum-preview #iq-app{position:relative;min-height:710px;display:flex;flex-direction:column}
  #iqum-preview .iq-content{padding:14px 22px 22px;flex:1;position:relative}
  #iqum-preview .iq-content.iq-game{padding:10px 19px 20px}
  #iqum-preview .iq-device button{font-family:inherit;color:inherit;border:0;background:none;min-height:44px;touch-action:manipulation;cursor:inherit}
  #iqum-preview .iq-device button:not(:disabled){cursor:pointer}
  #iqum-preview .iq-device button:disabled{cursor:default;opacity:.46}
  #iqum-preview .iq-device button:focus-visible{outline:3px solid var(--iq-gold);outline-offset:3px}
  #iqum-preview :where(h1,h2,h3,p){margin:0}
  #iqum-preview .iq-display{font:400 36px/1.1 Georgia,serif;letter-spacing:-1.2px}
  #iqum-preview .iq-title{font:400 29px/1.15 Georgia,serif;letter-spacing:-.7px}
  #iqum-preview .iq-subtitle{font:400 21px/1.2 Georgia,serif;letter-spacing:-.2px}
  #iqum-preview .iq-eyebrow{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--iq-muted)}
  #iqum-preview .iq-muted{color:var(--iq-muted);font-size:12px;line-height:1.6}
  #iqum-preview .iq-topline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}
  #iqum-preview .iq-logo{width:118px;height:42px;object-fit:contain;object-position:left center}
  #iqum-preview .iq-avatar{width:35px;height:35px;min-height:35px!important;border:1px solid var(--iq-line)!important;border-radius:50%;display:grid;place-items:center;background:var(--iq-paper)!important;font:15px Georgia,serif!important}
  #iqum-preview .iq-avatar.iq-active-avatar{background:var(--iq-green)!important;color:#f5f8f5;border:2px solid var(--iq-gold)!important;box-shadow:0 0 0 3px #d69a471f}
  #iqum-preview .iq-hero{margin-bottom:18px}
  #iqum-preview .iq-hero .iq-eyebrow{margin-bottom:12px}
  #iqum-preview .iq-hero .iq-muted{margin-top:12px}
  #iqum-preview .iq-hearts{display:flex;align-items:center;gap:3px;color:var(--iq-red);font-size:18px;letter-spacing:1px;white-space:nowrap}
  #iqum-preview .iq-heart-empty{color:#c9c0b4}
  #iqum-preview .iq-hearts small{font:11px 'Segoe UI',sans-serif;color:var(--iq-muted);letter-spacing:0;margin-left:4px}
  #iqum-preview .iq-feature{height:198px;border-radius:15px;padding:23px;background:linear-gradient(130deg,#286a59,#123e38);color:#f8f1e2;position:relative;overflow:hidden;box-shadow:0 7px 0 #1d211b,0 14px 23px #1838311c;margin-bottom:21px}
  #iqum-preview .iq-feature .iq-eyebrow{color:#cab68c;font-size:9px;margin-bottom:11px}
  #iqum-preview .iq-feature h2{font:400 24px/1.2 Georgia,serif;letter-spacing:-.3px;position:relative;z-index:2;max-width:210px}
  #iqum-preview .iq-feature .iq-level-caption{margin-top:8px;color:#c9c9ba;font-size:11px}
  #iqum-preview .iq-feature .iq-primary{position:absolute;bottom:18px;left:23px;min-width:145px;width:auto;z-index:2;background:var(--iq-gold-light)!important;color:#183831!important;min-height:44px;font-size:12px;box-shadow:0 3px 0 #8a754e}
  #iqum-preview .iq-mini-path{position:absolute;right:-3px;bottom:27px;width:129px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;transform:perspective(400px) rotateX(30deg) rotateZ(-17deg);opacity:.9}
  #iqum-preview .iq-mini-tile{height:29px;background:linear-gradient(140deg,#6d7162,#444a3f);border:1px solid #a6ac9140;border-radius:3px;box-shadow:0 4px 0 #151c15}
  #iqum-preview .iq-mini-tile.iq-safe{background:linear-gradient(140deg,#a5ba8e,#568060);border-color:#d2dab282}
  #iqum-preview .iq-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;gap:10px}
  #iqum-preview .iq-section-head .iq-eyebrow{font-size:10px}
  #iqum-preview .iq-training-list{display:grid;gap:0}
  #iqum-preview .iq-training-row{display:grid;grid-template-columns:67px 1fr;gap:16px;padding:8px 0 10px;border-bottom:1px solid var(--iq-line)}
  #iqum-preview .iq-training-row:last-child{border-bottom:0}
  #iqum-preview .iq-training-art{width:62px;height:68px;position:relative;margin-top:3px}
  #iqum-preview .iq-art-card{position:absolute;width:49px;height:64px;border-radius:6px;background:linear-gradient(140deg,#f8ecd2,#d6c29a);border:1px solid #d8c296;box-shadow:0 3px 0 #89754e,0 7px 10px #0002;left:7px;top:3px;transform:rotate(-10deg);display:grid;place-items:center}
  #iqum-preview .iq-art-card:first-child{left:15px;top:9px;transform:rotate(10deg);background:#383a31;border:1px solid #948366}
  #iqum-preview .iq-art-card img{width:40px;height:40px;object-fit:contain}
  #iqum-preview .iq-training-copy h3{font:400 20px/1.25 Georgia,serif;margin:0 0 3px}
  #iqum-preview .iq-training-copy .iq-muted{font-size:11px}
  #iqum-preview .iq-row-actions{display:flex;gap:12px;margin-top:2px;align-items:center}
  #iqum-preview .iq-row-actions button{font-size:11px;padding:0;min-height:44px;white-space:nowrap}
  #iqum-preview .iq-row-actions button:first-child{color:var(--iq-green);font-weight:600}
  #iqum-preview .iq-row-actions button+button{color:var(--iq-muted)}
  #iqum-preview .iq-row-actions button+button:before{content:'·';margin-right:12px;color:#a99d89}
  #iqum-preview .iq-nav{display:flex;justify-content:space-around;align-items:center;padding:8px 18px 2px;border-top:1px solid var(--iq-line);background:var(--iq-ivory);margin-top:auto}
  #iqum-preview .iq-nav button{display:grid;justify-items:center;align-content:center;gap:3px;min-width:62px;min-height:48px;font-size:10px;color:var(--iq-muted)}
  #iqum-preview .iq-nav button span:first-child{font-size:19px;line-height:1}
  #iqum-preview .iq-nav .iq-nav-active{color:var(--iq-green);font-weight:600}
  #iqum-preview .iq-primary,#iqum-preview .iq-secondary{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:48px!important;border-radius:9px;padding:12px 16px!important;font-size:13px;font-weight:600;letter-spacing:.1px;transition:transform 150ms,background 150ms}
  #iqum-preview .iq-primary{background:var(--iq-green)!important;color:#fff9ed!important;box-shadow:0 3px 0 #254635}
  #iqum-preview .iq-primary:active{transform:translateY(2px);box-shadow:none}
  #iqum-preview .iq-secondary{border:1px solid var(--iq-line)!important;background:var(--iq-paper)!important;color:var(--iq-ink)!important}
  #iqum-preview .iq-link{font-size:12px;padding:8px 0!important;color:var(--iq-muted)!important;text-decoration:underline;text-underline-offset:4px}
  #iqum-preview .iq-back{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:7px}
  #iqum-preview .iq-back button{padding:0;min-width:32px;font-size:26px;text-align:left}
  #iqum-preview .iq-back .iq-eyebrow{flex:1;text-align:center;font-size:10px}
  #iqum-preview .iq-back .iq-small-logo{width:32px;height:32px}
  #iqum-preview .iq-header-block{margin-bottom:18px}
  #iqum-preview .iq-header-block .iq-muted{margin-top:7px}
  #iqum-preview .iq-progress-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--iq-muted);margin:22px 0 8px}
  #iqum-preview .iq-progress-track{height:3px;background:#ddd6c7;border-radius:3px;overflow:hidden}
  #iqum-preview .iq-progress-fill{height:100%;background:var(--iq-gold)}
  #iqum-preview .iq-levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px 10px;margin:29px 0 24px}
  #iqum-preview .iq-level{aspect-ratio:1;min-height:44px!important;border:1px solid #d1c7b4!important;border-radius:8px;background:#ebe4d5!important;box-shadow:0 4px 0 #b4a98f;color:#6b624f!important;font-family:Georgia,serif!important;font-size:17px}
  #iqum-preview .iq-level.iq-done{background:#dfe6d9!important;color:var(--iq-green)!important;border-color:#c3cebb!important;box-shadow:0 4px 0 #a8b59b}
  #iqum-preview .iq-level.iq-current{background:var(--iq-green)!important;color:#f4eedf!important;border-color:#5a8065!important;box-shadow:0 4px 0 #214631,0 0 0 4px #147d6915}
  #iqum-preview .iq-level:disabled{opacity:.6;font-size:13px;color:#8f8777!important}
  #iqum-preview .iq-footnote{text-align:center;font-size:11px;line-height:1.6;color:var(--iq-muted);margin-top:14px!important}
  #iqum-preview .iq-board{padding:15px;border-radius:14px;background:linear-gradient(135deg,#276257,#143f39 60%,#1a4a40);border:1px solid #665641;box-shadow:inset 0 0 0 4px #352b21,inset 0 0 0 5px #87714b55,0 8px 0 #211f1b,0 16px 25px #18383126;position:relative;perspective:850px}
  #iqum-preview .iq-board:after{content:'';position:absolute;inset:7px;border:1px solid #b6a07b22;border-radius:9px;pointer-events:none}
  #iqum-preview .iq-card-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;transform:perspective(800px) rotateX(5deg);transform-origin:center bottom}
  #iqum-preview .iq-memory-card{padding:0!important;aspect-ratio:.84;border-radius:var(--iq-radius);perspective:500px;position:relative;min-width:0;min-height:44px!important;opacity:1!important}
  #iqum-preview .iq-card-inner{position:absolute;inset:0;transition:transform var(--iq-flip) cubic-bezier(.22,.65,.25,1);transform-style:preserve-3d}
  #iqum-preview .iq-memory-card.iq-open .iq-card-inner{transform:rotateY(180deg)}
  #iqum-preview .iq-card-back,#iqum-preview .iq-card-front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--iq-radius);display:grid;place-items:center}
  #iqum-preview .iq-card-back{background:linear-gradient(135deg,#347968,#184e42);border:1px solid #9a88604d;box-shadow:0 var(--iq-depth) 0 #131b13,0 7px 8px #0005,inset 0 0 0 4px #343b30,inset 0 0 0 5px #a28c5d3d}
  #iqum-preview .iq-card-back img{width:38%;height:42%;opacity:.65;filter:none}
  #iqum-preview .iq-card-front{transform:rotateY(180deg);background:linear-gradient(135deg,#ffffff,#e5ece0);border:1px solid #f2dfb6;box-shadow:0 var(--iq-depth) 0 #8d744d,0 7px 8px #0004,inset 0 0 0 4px #dbc494,inset 0 0 0 5px #9b805249}
  #iqum-preview .iq-card-front img{width:90%;height:84%;object-fit:contain}
  #iqum-preview .iq-memory-card.iq-matched .iq-card-front{background:linear-gradient(140deg,#e4f4e7,#acd8ba);border-color:#d7e2bd;box-shadow:0 4px 0 #788465,inset 0 0 0 4px #becbaa,inset 0 0 0 5px #73846455}
  #iqum-preview .iq-memory-card.iq-matched:after{content:'✓';position:absolute;right:5px;bottom:2px;font-size:10px;color:#385540;pointer-events:none}
  #iqum-preview .iq-scoreboard{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;gap:8px;margin:0 0 17px}
  #iqum-preview .iq-player{display:flex;gap:9px;align-items:center;font-size:11px}
  #iqum-preview .iq-player:last-child{flex-direction:row-reverse;text-align:right}
  #iqum-preview .iq-player strong{font-size:12px;display:block;font-weight:600}
  #iqum-preview .iq-player small{color:var(--iq-muted);font-size:10px;display:block;margin-top:2px}
  #iqum-preview .iq-score{font:400 26px Georgia,serif;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
  #iqum-preview .iq-score span{color:#aaa08b;margin:0 5px;font:16px 'Segoe UI',sans-serif}
  #iqum-preview .iq-turn-row{display:flex;align-items:center;justify-content:space-between;margin:0 0 11px;font-size:12px;gap:8px}
  #iqum-preview .iq-turn-label{display:flex;gap:7px;align-items:center}
  #iqum-preview .iq-dot{width:6px;height:6px;border-radius:50%;background:var(--iq-green);display:inline-block;flex-shrink:0}
  #iqum-preview .iq-time{font-size:13px;font-variant-numeric:tabular-nums;color:var(--iq-green);font-weight:600;white-space:nowrap}
  #iqum-preview .iq-clock-track{height:3px;background:#dcd6c9;margin-bottom:22px;border-radius:3px;overflow:hidden}
  #iqum-preview .iq-clock-fill{height:100%;background:var(--iq-gold);transform-origin:left;transition:transform 250ms linear}
  #iqum-preview .iq-game-note{min-height:44px;margin-top:22px;text-align:center;color:var(--iq-muted);font-size:12px;line-height:1.6}
  #iqum-preview .iq-game-note strong{display:block;color:var(--iq-ink);font-weight:500}
  #iqum-preview .iq-game-footer{display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px solid var(--iq-line);font-size:10px;color:var(--iq-muted);margin-top:17px}
  #iqum-preview .iq-game-footer strong{color:var(--iq-ink);font-size:12px;font-weight:500}
  #iqum-preview .iq-mode-pills{display:flex;gap:4px;padding:4px;border:1px solid var(--iq-line);border-radius:10px;margin-bottom:22px}
  #iqum-preview .iq-mode-pills button{flex:1;font-size:12px;min-height:37px!important;border-radius:6px;padding:7px 5px}
  #iqum-preview .iq-mode-pills button[aria-pressed=true]{background:var(--iq-paper);box-shadow:0 2px 5px #18383110;color:var(--iq-green);font-weight:600}
  #iqum-preview .iq-sequence-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  #iqum-preview .iq-sequence-grid.iq-twelve{grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
  #iqum-preview .iq-sequence-grid .iq-memory-card{aspect-ratio:.95}
  #iqum-preview .iq-card-number{position:absolute;bottom:3px;left:0;right:0;text-align:center;color:#cdb88c;z-index:2;font-size:9px;pointer-events:none}
  #iqum-preview .iq-memory-card.iq-open .iq-card-number{color:#736145}
  #iqum-preview .iq-sequence-grid .iq-current-card .iq-card-back{border-color:#e2c47f;box-shadow:0 5px 0 #181e14,0 0 0 2px #c4a66966}
  #iqum-preview .iq-animal-picker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:14px}
  #iqum-preview .iq-animal-choice{min-height:58px!important;background:#eae2d2!important;border:1px solid #d8cbb4!important;border-radius:7px;padding:4px 2px!important;display:grid;justify-items:center;gap:0}
  #iqum-preview .iq-animal-choice img{width:35px;height:35px}
  #iqum-preview .iq-animal-choice span{font-size:11px;color:#625848}
  #iqum-preview .iq-action-space{margin-top:24px}
  #iqum-preview .iq-path-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
  #iqum-preview .iq-path-board{padding:19px 17px 23px;background:linear-gradient(145deg,#e2eee6,#c9ded2);border:1px solid #6a6a54;box-shadow:inset 0 0 0 5px #3a3b2e,0 9px 0 #252a21,0 17px 25px #18383120}
  #iqum-preview .iq-path-grid{display:grid;gap:8px;transform:perspective(750px) rotateX(10deg);transform-origin:bottom center}
  #iqum-preview .iq-path-tile{padding:0!important;min-height:44px!important;aspect-ratio:1.6;border-radius:5px;background:linear-gradient(135deg,#fafcf6,#bdcdb5)!important;border:1px solid #bdb18c77!important;box-shadow:0 5px 0 #383c2d,inset 0 1px 0 #c9bd9744;position:relative;transition:transform 180ms,background 180ms,box-shadow 180ms;opacity:1!important}
  #iqum-preview .iq-path-tile:before{content:'';position:absolute;inset:5px;border:1px solid #c5b8881f;border-radius:2px}
  #iqum-preview .iq-path-tile.iq-lit{background:linear-gradient(135deg,#abc18f,#64845d)!important;border-color:#d2dbb4aa!important;box-shadow:0 5px 0 #3c553a,inset 0 1px 0 #ecf1d577}
  #iqum-preview .iq-path-tile.iq-stepped{background:linear-gradient(135deg,#7f9b6d,#288365)!important;transform:translateY(3px);box-shadow:0 2px 0 #253f2e,inset 0 1px 0 #c3d0a755}
  #iqum-preview .iq-path-tile.iq-next{border-color:#d4bd8499!important}
  #iqum-preview .iq-path-tile.iq-wrong{background:linear-gradient(135deg,#b77b6c,#82483e)!important;transform:translateY(3px);box-shadow:0 2px 0 #542e28}
  #iqum-preview .iq-path-marker{font-size:16px;color:#e3e6c7;position:relative;z-index:1}
  #iqum-preview .iq-path-end{text-align:center;font-size:8px;letter-spacing:4px;color:#d2c9ad;margin-bottom:15px}
  #iqum-preview .iq-path-start{text-align:center;font-size:8px;letter-spacing:4px;color:var(--iq-muted);margin-top:18px}

  function levels(){const height=3152;const line=Array.from({length:697},(_,i)=>{const t=i/24;return (i?'L':'M')+(150+81*Math.sin(t*Math.PI/3)).toFixed(2)+' '+(height-52-t*104).toFixed(2);}).join(' ');return `<section class="iq-content">${back('YOLCULUK')}<div class="iq-header-block"><p class="iq-eyebrow">HER ADIM BİR HATIRA</p><h1 class="iq-title">Hafıza Yolu</h1><p class="iq-muted">Aklında tut. Bir adım yüksel.</p></div><div class="iq-path-head">${hearts()}<span class="iq-muted">${state.hearts===4?'Canların dolu':'Bir sonraki can '+minutes((state.refillAt||Date.now()+1800000)-Date.now())}</span></div><div class="iq-progress-row"><span>Level ${String(state.unlocked).padStart(2,'0')}</span><span>${state.unlocked-1} / 30 tamamlandı</span></div><div class="iq-progress-track"><div class="iq-progress-fill" style="width:${(state.unlocked-1)/30*100}%"></div></div><div class="iq-road-scroll" aria-label="Leveller aşağıdan yukarıya ilerler"><div class="iq-level-road"><svg viewBox="0 0 300 3152" preserveAspectRatio="none" aria-hidden="true"><path d="${line}"/></svg>${[1,11,21].map((n,i)=>`<span class="iq-road-chapter" style="top:${height-52-(n-1)*104-76}px">${['01 — ODAK','02 — RİTİM','03 — USTALIK'][i]}</span>`).join('')}${Array.from({length:30},(_,i)=>{const n=i+1,x=50+27*Math.sin(i*Math.PI/3);return `<button class="iq-level ${n<state.unlocked?'iq-done':n===state.unlocked?'iq-current':''}" style="top:${height-52-i*104-31}px;left:${x}%" data-level="${n}" ${n>state.unlocked?'disabled':''} aria-label="Level ${n}${n>state.unlocked?', kilitli':''}"><span>${String(n).padStart(2,'0')}</span>${n<state.unlocked?'<small>✓</small>':n>state.unlocked?'<small>·</small>':''}</button>`;}).join('')}</div></div><button class="iq-primary" data-go="path">Level ${state.level} ile devam et <span aria-hidden="true">↗</span></button><p class="iq-footnote">Dört can. Otuz adım. Kendi ritminde.</p></section>${nav()}`;}
  function card(animal,index,open=false,matched=false,extra=''){return `<button class="iq-memory-card ${open?'iq-open':''} ${matched?'iq-matched':''} ${extra}" data-card="${index}" aria-label="${matched?'Eşleşmiş kart':open?animalNames[animal]:'Kapalı kart '+(index+1)}" ${matched?'disabled':''}><span class="iq-card-inner"><span class="iq-card-back">${img('iqum-mark-light')}</span><span class="iq-card-front">${img(animal,'',animalNames[animal])}</span></span></button>`;}

ts===0?'disabled':''}>${state.hearts===0?'Can yenilenmesi bekleniyor':'Yolu ezberle'} <span aria-hidden="true">→</span></button></div>`:''}<div class="iq-game-footer"><span>Adım <strong>${pathGame.row} / ${cfg.rows}</strong></span><span>Hata <strong>−1 can</strong></span></div></section>${state.hearts===0?noHearts():''}`;}

  const scenarios={home:[['normal','Standart']],levels:[['normal','İlerleme'],['no-hearts','Sıfır kalp']],sequence:[['normal','Başlangıç'],['wrong','Yanlış cevap'],['timeout','Süre doldu']],matching:[['normal','Düello'],['training','Antrenman'],['mismatch','Eşleşmeyen kartlar'],['timeout','Süre doldu'],['disconnected','Bağlantı kesildi']],path:[['normal','Başlangıç'],['wrong','Yanlış adım'],['no-hearts','Sıfır kalp']],duel:[['normal','Oyun seçimi'],['waiting','Oda bekliyor'],['expired','Oda süresi doldu'],['found','Rakip bulundu']],result:[['normal','Galibiyet'],['draw','Beraberlik'],['loss','Mağlubiyet']],account:[['normal','Misafir'],['connected','Hesaba bağlı']],brand:[['normal','Logo ailesi']]};

  function resetPair(solo=false){Object.assign(pair,{opened:[],matched:new Set(),owners:{},scores:[0,0],turn:0,phase:'playing',active:false,deadline:0,feedbackAt:0,nextTurn:0,attempts:0,solo,startedAt:0,message:solo?'İlk kartını aç, eşini hatırla.':'İlk kartını aç. İki kart için toplam 15 saniyen var.'});state.viewer=0;}

  function applyScenario(scenario){stopClock();stopFeedback();state.scenario=scenario;state.result=null;if(state.screen==='matching'){resetPair(scenario==='training');if(scenario==='mismatch'){pair.opened=[0,1];pair.phase='feedback';pair.message='Eşleşmedi. Kartlar kapanınca sıra Deniz’de.';}if(scenario==='timeout'){pair.turn=1;pair.message='Süren doldu. Puanın değişmedi; sıra Deniz’de.';}}if(state.screen==='sequence'){resetSequence();if(scenario==='wrong'||scenario==='timeout'){sequence.phase='failed';sequence.answers=2;sequence.total=2;sequence.message=scenario==='wrong'?'Bu kartın hayvanı farklıydı. Turun burada bitti.':'Cevap süren doldu. İki doğru cevabın korundu.';}}if(state.screen==='path'||state.screen==='levels'){resetPath();state.hearts=scenario==='no-hearts'?0:scenario==='wrong'?3:4;state.refillAt=state.hearts<4?Date.now()+1800000:null;if(scenario==='wrong'){pathGame.phase='error';pathGame.wrong='0:0';if(route()[0]===0)pathGame.wrong='0:1';pathGame.message='Yanlış adım. Bir can gitti; aynı leveli yeniden ezberle.';}}if(state.screen==='account')state.signedIn=scenario==='connected';if(state.screen==='duel'){state.duelPhase=scenario==='waiting'||scenario==='expired'?'room':scenario==='found'?'found':'idle';state.ready=false;if(scenario==='found'){state.duelDeadline=Date.now()+3000;ensureClock();}}render();persist();}
  function updatePair(){const grid=root.querySelector('#iq-pair-grid');if(!grid)return;grid.querySelectorAll('[data-card]').forEach(button=>{const i=Number(button.dataset.card),visible=pair.opened.includes(i)||pair.matched.has(i);button.classList.toggle('iq-open',visible);button.classList.toggle('iq-matched',pair.matched.has(i));button.disabled=pair.matched.has(i)||pair.phase!=='playing'||(!pair.solo&&pair.turn!==state.viewer);button.setAttribute('aria-label',pair.matched.has(i)?'Eşleşmiş '+animalNames[pair.board[i]]:visible?animalNames[pair.board[i]]:'Kapalı kart '+(i+1));});const score=root.querySelector('#iq-pair-score');if(score){const changed=score.textContent!==`${pair.scores[0]}:${pair.scores[1]}`;score.innerHTML=`${pair.scores[0]}<span>:</span>${pair.scores[1]}`;if(changed&&!matchMedia("(prefers-reduced-motion: reduce)").matches)score.animate([{transform:"rotateX(35deg)",opacity:.6},{transform:"rotateX(0)",opacity:1}],{duration:260,easing:"ease-out"});}root.querySelectorAll('[data-player]').forEach(p=>p.classList.toggle('iq-active-avatar',Number(p.dataset.player)===pair.turn));const turn=root.querySelector('#iq-turn-text');if(turn)turn.textContent=pair.solo?'Bir çift bul':pair.phase==='feedback'?'Kartları aklında tut':pair.turn===state.viewer?'Sıra sende':(pair.turn===0?'Sen':'Deniz')+' oynuyor';const message=root.querySelector('#iq-pair-message');if(message)message.textContent=pair.message;const count=root.querySelector('#iq-found-count');if(count)count.textContent=pair.matched.size/2+' / 8';const attempts=root.querySelector('#iq-attempt-count');if(attempts)attempts.textContent=pair.attempts;updatePairClock();}
  function updatePairClock(){const clockEl=root.querySelector('#iq-pair-clock'),bar=root.querySelector('#iq-pair-progress');if(pair.solo){const solo=root.querySelector('#iq-solo-clock');if(solo)solo.textContent=minutes(pair.active?Date.now()-pair.startedAt:0);return;}const remaining=pair.phase==='feedback'?0:pair.active?Math.max(0,pair.deadline-Date.now()):15000;if(clockEl)clockEl.textContent=minutes(remaining);if(bar)bar.style.transform=`scaleX(${remaining/15000})`;}
  function pickCard(index){if(pair.phase!=='playing'||pair.matched.has(index)||pair.opened.includes(index)||(!pair.solo&&state.viewer!==pair.turn))return;if(!pair.active){pair.active=true;pair.startedAt=Date.now();pair.deadline=Date.now()+15000;ensureClock();}if(!pair.solo&&Date.now()>=pair.deadline){expirePair();return;}pair.opened.push(index);pair.message=pair.opened.length===1?'Şimdi eşini seç. İlk kart süreyi yenilemez.':'İki kartını da aklında tut.';if(pair.opened.length===2){pair.attempts++;const [a,b]=pair.opened;const matched=pair.board[a]===pair.board[b];pair.phase='feedback';pair.feedbackAt=Date.now()+(matched?600:900);pair.nextTurn=matched||pair.solo?pair.turn:1-pair.turn;if(matched){pair.matched.add(a);pair.matched.add(b);pair.owners[a]=pair.turn;pair.owners[b]=pair.turn;pair.scores[pair.turn]++;pair.message=pair.solo?'Bir çift daha hatırladın.':`${pair.turn===0?'Sen':'Deniz'} +1 puan. Eşleşme bulundu; sıra aynı oyuncuda.`;}else pair.message=pair.solo?'Bu ikisi farklı. Yerlerini aklında tut.':'Eşleşmedi. Puan eksilmez; sıra diğer oyuncuya geçer.';}updatePair();}

  function startSequence(){sequence.phase='preview';sequence.answers=0;sequence.deadline=Date.now()+[6,8,10][sequence.round]*1000;sequence.message='Hayvanları ve yerlerini aklında tut.';render();ensureClock();}

  function action(name){switch(name){case'start-sequence':startSequence();break;case'next-sequence':if(sequence.round<2){sequence.round++;sequence.phase='ready';sequence.answers=0;sequence.message='Yeni tur. Biraz daha fazlasını hatırla.';render();}else{state.result={type:'training',game:'sequence',summary:sequence.total+' / 27 doğru',outcome:'win'};go('result');}break;case'start-path':startPath();break;case'find-match':startSearch();break;case'create-room':if(requireAccount('room')){state.duelPhase='room';state.roomCode='QM7K2A';render();}break;case'join-room':{const value=root.querySelector('#iq-room-input').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(value)){root.querySelector('#iq-room-error').textContent='Lütfen altı harf veya rakamdan oluşan kodu gir.';return;}state.roomCode=value;if(requireAccount('room')){state.duelPhase='room';render();}break;}case'copy-code':navigator.clipboard?.writeText(state.roomCode||'QM7K2A').then(()=>previewNote('Oda kodu kopyalandı · bu tasarımdaki oda örnektir.')).catch(()=>previewNote('Örnek oda kodu: '+(state.roomCode||'QM7K2A')));break;case'ready-room':state.ready=true;if(state.scenario==='waiting'){render();}else{state.duelPhase='found';state.duelDeadline=Date.now()+3000;render();ensureClock();}break;case'new-room':state.scenario='normal';state.duelPhase='room';state.ready=false;state.roomCode='K8M2QA';render();break;case'cancel-search':go('duel');break;case'sign-google':signIn();break;case'sign-apple':if(state.platform==='ios')signIn();break;case'sign-out':state.signedIn=false;render();break;case'reconnect':state.scenario='normal';render();break;case'play-again':{const type=state.result?.type,game=state.result?.game;if(type==='path'){if(state.level<30){state.level++;resetPath();go('path');}else go('levels');}else if(type==='training'){if(game==='sequence'){resetSequence();go('sequence');}else{resetPair(true);go('matching');}}else{state.result=null;resetPair(false);go('matching');}break;}}}
  root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.dataset.go){const destination=button.dataset.go;if(destination==='path')resetPath();go(destination);return;}if(button.dataset.level){state.level=Number(button.dataset.level);resetPath();go('path');return;}if(button.dataset.play){if(button.dataset.play==='matching'){resetPair(true);go('matching');pair.solo=true;render();}else{resetSequence();state.pending=null;go('sequence');}return;}if(button.dataset.duel){state.duelGame=button.dataset.duel;go('duel');return;}if(button.dataset.duelGame){state.duelGame=button.dataset.duelGame;render();return;}if(button.dataset.action){action(button.dataset.action);return;}if(button.dataset.card!==undefined&&state.screen==='matching'){pickCard(Number(button.dataset.card));return;}if(button.dataset.answer){answerSequence(button.dataset.answer);return;}if(button.dataset.tile){const [r,c]=button.dataset.tile.split(':').map(Number);stepPath(r,c);}});

  function tick(){if(destroyed){stopClock();return;}if(document.hidden)return;const now=Date.now();if(state.hearts<4&&state.refillAt&&now>=state.refillAt){const add=1+Math.floor((now-state.refillAt)/1800000);state.hearts=Math.min(4,state.hearts+add);state.refillAt=state.hearts===4?null:state.refillAt+add*1800000;render();}const refill=root.querySelector('#iq-refill-clock');if(refill)refill.textContent=minutes((state.refillAt||now)-now);if(state.screen==='matching'&&pair.active){if(pair.phase==='feedback'&&now>=pair.feedbackAt){if(pair.matched.size===16){finishPair();return;}pair.opened=[];pair.turn=pair.nextTurn;pair.phase='playing';pair.deadline=now+15000;pair.message=pair.solo?'Bir sonraki çifti bul.':pair.turn===state.viewer?'Sıra sende. İki kart için 15 saniyen var.':'Rakibinin açtığı kartları aklında tut.';updatePair();}else if(!pair.solo&&pair.phase==='playing'&&now>=pair.deadline)expirePair();updatePairClock();return;}if(state.screen==='sequence'&&(sequence.phase==='preview'||sequence.phase==='answer')){const el=root.querySelector('#iq-seq-clock');if(el)el.textContent=minutes(sequence.deadline-now);const max=[6,8,10][sequence.round]*1000,answerMax=[30,45,60][sequence.round]*1000;const bar=root.querySelector('#iq-seq-progress');if(bar)bar.style.transform=`scaleX(${Math.max(0,(sequence.deadline-now)/(sequence.phase==='preview'?max:answerMax))})`;if(now>=sequence.deadline){if(sequence.phase==='preview'){sequence.phase='answer';sequence.deadline=now+answerMax;sequence.answerStartedAt=now;sequence.message='Kartlar kapandı. İlk hayvan hangisiydi?';render();}else failSequence('Cevap süren doldu. Doğru cevapların korundu.');}return;}if(state.screen==='path'&&pathGame.phase==='preview'){const el=root.querySelector('#iq-path-clock');if(el)el.textContent=minutes(pathGame.deadline-now);const bar=root.querySelector('#iq-path-progress');if(bar)bar.style.transform=`scaleX(${Math.max(0,(pathGame.deadline-now)/(levelConfig().preview*1000))})`;if(now>=pathGame.deadline){pathGa   render();applyDesign();
  if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.iq-device'),onChange:applyDesign});tweak.addColorPicker(settings,'gold',{label:'Mat altın',reference:'--iq-gold'});tweak.addSlider(settings,'depth',{label:'Kart kalınlığı',min:2,max:7,step:1,unit:'px',reference:'--iq-depth'});tweak.addToggle(settings,'motion',{label:'Kart dönüşü'});}
  new MutationObserver((_,observer)=>{if(!root.isConnected){destroyed=true;stopClock();stopFeedback();observer.disconnect();}}).observe(root.parentNode,{childList:true});
})();
</script>
